<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VECTOR — Blog</title>
<meta name="description" content="VECTOR — რჩევები და გზამკვლევები უსაფრთხოებისა და ელექტრო სისტემების შესახებ.">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>

<body data-title-key="blog.title">

<div id="app-header"></div>

<!-- ================= BLOG HERO ================= -->
<section class="relative overflow-hidden hero-bg pt-32 pb-16 md:pt-40 md:pb-20">
  <div class="blueprint-grid"></div>
  <div class="max-w-4xl mx-auto px-5 md:px-8 relative text-center">
    <div class="flex items-center justify-center gap-2 mb-3">
      <span class="eyebrow-dash"></span>
      <span class="text-xs font-semibold tracking-widest uppercase font-display" style="color:var(--emerald);" data-i18n="blog.eyebrow"></span>
      <span class="eyebrow-dash"></span>
    </div>
    <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold text-white mb-4 font-display" data-i18n="blog.title"></h1>
    <p class="text-base md:text-lg" style="color:rgba(255,255,255,0.68);" data-i18n="blog.subtitle"></p>
  </div>
</section>

<!-- ================= BLOG GRID ================= -->
<section class="py-16 md:py-20" style="background:var(--paper);">
  <div class="max-w-7xl mx-auto px-5 md:px-8">
    <div id="blog-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>
</section>

<div id="app-footer"></div>

<script src="assets/js/i18n.js"></script>
<script>window.CURRENT_PAGE = "blog";</script>
<script src="assets/js/app.js"></script>
</body>
</html>
