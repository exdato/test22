<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>გვერდი ვერ მოიძებნა — VECTOR</title>
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B1424; --emerald:#12B76A; --emerald-dark:#0a8a54;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter',sans-serif;
    background:linear-gradient(160deg,#0B1424 0%,#0F1E38 55%,#0B1424 100%);
    color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; text-align:center; padding:24px;
    position:relative; overflow:hidden;
  }
  .grid-bg{
    position:absolute; inset:0; pointer-events:none; opacity:.09;
    background-image:linear-gradient(rgba(18,183,106,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(18,183,106,.6) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 40%,black 0%,transparent 72%);
    mask-image:radial-gradient(ellipse at 50% 40%,black 0%,transparent 72%);
  }
  .content{position:relative; max-width:480px;}
  .logo{display:inline-flex; align-items:center; gap:10px; margin-bottom:48px; text-decoration:none;}
  .logo-mark{
    width:34px; height:34px; border-radius:8px;
    background:linear-gradient(135deg,var(--emerald) 0%,#0a8a54 100%);
    display:flex; align-items:center; justify-content:center;
  }
  .logo-text{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; color:#fff; letter-spacing:.02em;}
  .code{
    font-family:'JetBrains Mono',monospace; font-weight:600;
    font-size:96px; line-height:1; color:var(--emerald);
    letter-spacing:-0.02em; margin-bottom:16px;
  }
  h1{font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:700; margin-bottom:12px;}
  p{color:rgba(255,255,255,0.6); font-size:15px; line-height:1.6; margin-bottom:8px;}
  .sub{font-size:13px; color:rgba(255,255,255,0.4); margin-bottom:32px;}
  .actions{display:flex; flex-wrap:wrap; gap:12px; justify-content:center;}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:13px 26px; border-radius:9999px; font-size:14px; font-weight:600;
    text-decoration:none; transition:transform .2s ease;
  }
  .btn:hover{transform:scale(1.03);}
  .btn-primary{background:var(--emerald); color:#08111F;}
  .btn-outline{border:1px solid rgba(255,255,255,0.25); color:#fff;}
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="content">
    <a href="index.html" class="logo">
      <span class="logo-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1424" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </span>
      <span class="logo-text">VECTOR</span>
    </a>

    <div class="code">404</div>
    <h1>გვერდი ვერ მოიძებნა</h1>
    <p>სამწუხაროდ, თქვენ მიერ მოთხოვნილი გვერდი არ არსებობს ან გადატანილია.</p>
    <p class="sub">Page not found — it may have been moved or the link is incorrect.</p>

    <div class="actions">
      <a href="index.html" class="btn btn-primary">მთავარ გვერდზე დაბრუნება</a>
      <a href="tel:595708300" class="btn btn-outline">დარეკვა: 595 70 83 00</a>
    </div>
  </div>
</body>
</html>
