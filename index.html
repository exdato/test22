<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VECTOR — უსაფრთხოება & ელექტრო სერვისი</title>
<meta name="description" content="VECTOR — ვიდეო სამეთვალყურეო, სიგნალიზაციის, სახანძრო და ელექტრო სისტემების მონტაჟი თბილისსა და შემოგარენში.">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>

<body data-title-key="home.servicesIntro.title">

<div id="app-header"></div>

<!-- ================= HERO ================= -->
<section id="home" class="relative overflow-hidden hero-bg">
  <div class="blueprint-grid"></div>
  <div class="max-w-7xl mx-auto px-5 md:px-8 pt-32 pb-20 md:pt-40 md:pb-28 relative">
    <div class="grid lg:grid-cols-2 gap-14 items-center">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full mb-6" style="background:rgba(18,183,106,0.12);border:1px solid rgba(18,183,106,0.35);">
          <span class="badge-dot"><span class="ping"></span><span class="dot"></span></span>
          <span class="text-xs font-medium tracking-wide" style="color:var(--emerald);" data-i18n="home.hero.badgeLive"></span>
        </div>

        <div class="flex items-center gap-2 mb-3">
          <span class="eyebrow-dash"></span>
          <span class="text-xs font-semibold tracking-widest uppercase font-display" style="color:var(--emerald);" data-i18n="home.hero.eyebrow"></span>
        </div>

        <h1 class="text-4xl sm:text-5xl md:text-6xl font-bold leading-[1.05] text-white mb-6 font-display" style="letter-spacing:-0.01em;">
          <span data-i18n="home.hero.title1"></span><br>
          <span style="color:var(--emerald);" data-i18n="home.hero.title2"></span>
        </h1>

        <p class="text-base md:text-lg leading-relaxed mb-9 max-w-lg" style="color:rgba(255,255,255,0.68);" data-i18n="home.hero.subtitle"></p>

        <div class="flex flex-wrap items-center gap-4 mb-14">
          <a href="tel:595708300" class="inline-flex items-center gap-2.5 px-6 py-3.5 rounded-full text-sm font-semibold btn-primary">
            <i data-lucide="phone" class="w-4 h-4"></i>
            <span data-i18n="home.hero.ctaCall"></span>
          </a>
          <a href="#services" class="inline-flex items-center gap-2 px-6 py-3.5 rounded-full text-sm font-semibold btn-outline">
            <span data-i18n="home.hero.ctaServices"></span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </a>
        </div>

        <div class="grid grid-cols-3 gap-6 max-w-md">
          <div>
            <div class="text-2xl md:text-3xl font-bold text-white font-display" data-i18n="home.hero.stat1"></div>
            <div class="text-[11px] md:text-xs mt-1 leading-snug" style="color:rgba(255,255,255,0.5);" data-i18n="home.hero.stat1Label"></div>
          </div>
          <div style="border-left:1px solid rgba(255,255,255,0.12);padding-left:20px;">
            <div class="text-2xl md:text-3xl font-bold text-white font-display" data-i18n="home.hero.stat2"></div>
            <div class="text-[11px] md:text-xs mt-1 leading-snug" style="color:rgba(255,255,255,0.5);" data-i18n="home.hero.stat2Label"></div>
          </div>
          <div style="border-left:1px solid rgba(255,255,255,0.12);padding-left:20px;">
            <div class="text-2xl md:text-3xl font-bold text-white font-display" data-i18n="home.hero.stat3"></div>
            <div class="text-[11px] md:text-xs mt-1 leading-snug" style="color:rgba(255,255,255,0.5);" data-i18n="home.hero.stat3Label"></div>
          </div>
        </div>
      </div>

      <div class="relative hidden lg:block">
        <div class="scan-frame">
          <div class="img-wrap">
            <img src="https://images.unsplash.com/photo-1557597774-9d273605dfa9?auto=format&fit=crop&w=1200&q=80" alt="CCTV monitoring" onerror="this.classList.add('broken')">
            <div class="img-fallback"><i data-lucide="camera" style="width:56px;height:56px;color:var(--emerald);" stroke-width="1.25"></i></div>
          </div>
          <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(11,20,36,0.15) 0%,rgba(11,20,36,0.55) 100%);"></div>
          <div class="corner" style="top:12px;left:12px;border-top:2px solid;border-left:2px solid;"></div>
          <div class="corner" style="top:12px;right:12px;border-top:2px solid;border-right:2px solid;"></div>
          <div class="corner" style="bottom:12px;left:12px;border-bottom:2px solid;border-left:2px solid;"></div>
          <div class="corner" style="bottom:12px;right:12px;border-bottom:2px solid;border-right:2px solid;"></div>
          <div class="scan-line"></div>
          <div class="absolute top-5 left-1/2 -translate-x-1/2 flex items-center gap-1.5 px-2.5 py-1 rounded-full" style="background:rgba(11,20,36,0.8);">
            <i data-lucide="radio" style="width:11px;height:11px;color:var(--emerald);"></i>
            <span class="text-[10px] tracking-widest font-semibold text-white">REC</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ================= SERVICES GRID ================= -->
<section id="services" class="py-24 md:py-28" style="background:var(--paper);">
  <div class="max-w-7xl mx-auto px-5 md:px-8">
    <div class="max-w-2xl mb-14">
      <div class="flex items-center gap-2 mb-3">
        <span class="eyebrow-dash"></span>
        <span class="text-xs font-semibold tracking-widest uppercase font-display" style="color:var(--emerald);" data-i18n="home.servicesIntro.eyebrow"></span>
      </div>
      <h2 class="text-3xl md:text-5xl font-bold mb-4 font-display" style="color:var(--navy);" data-i18n="home.servicesIntro.title"></h2>
      <p class="text-base md:text-lg" style="color:var(--text-muted);" data-i18n="home.servicesIntro.subtitle"></p>
    </div>

    <div id="services-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>
</section>

<!-- ================= WHY CHOOSE US ================= -->
<section id="why" class="py-20 md:py-24" style="background:#fff;border-top:1px solid #E3E7EC;border-bottom:1px solid #E3E7EC;">
  <div class="max-w-7xl mx-auto px-5 md:px-8">
    <div class="max-w-xl mb-12">
      <div class="flex items-center gap-2 mb-3">
        <span class="eyebrow-dash"></span>
        <span class="text-xs font-semibold tracking-widest uppercase font-display" style="color:var(--emerald);" data-i18n="home.whyUs.eyebrow"></span>
      </div>
      <h2 class="text-2xl md:text-4xl font-bold font-display" style="color:var(--navy);" data-i18n="home.whyUs.title"></h2>
    </div>
    <div id="why-grid" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-5"></div>
  </div>
</section>

<!-- ================= 3-STEP PROCESS ================= -->
<section id="process" class="py-20 md:py-24" style="background:var(--paper);">
  <div class="max-w-7xl mx-auto px-5 md:px-8">
    <div class="max-w-xl mb-14">
      <div class="flex items-center gap-2 mb-3">
        <span class="eyebrow-dash"></span>
        <span class="text-xs font-semibold tracking-widest uppercase font-display" style="color:var(--emerald);" data-i18n="home.process.eyebrow"></span>
      </div>
      <h2 class="text-2xl md:text-4xl font-bold mb-3 font-display" style="color:var(--navy);" data-i18n="home.process.title"></h2>
      <p class="text-base" style="color:var(--text-muted);" data-i18n="home.process.subtitle"></p>
    </div>
    <div id="process-steps" class="grid sm:grid-cols-3 gap-10"></div>
  </div>
</section>

<!-- ================= FAQ ================= -->
<section id="faq" class="py-20 md:py-24" style="background:#fff;">
  <div class="max-w-3xl mx-auto px-5 md:px-8">
    <div class="max-w-xl mb-10">
      <div class="flex items-center gap-2 mb-3">
        <span class="eyebrow-dash"></span>
        <span class="text-xs font-semibold tracking-widest uppercase font-display" style="color:var(--emerald);" data-i18n="home.faq.eyebrow"></span>
      </div>
      <h2 class="text-2xl md:text-4xl font-bold font-display" style="color:var(--navy);" data-i18n="home.faq.title"></h2>
    </div>
    <div id="faq-list" class="flex flex-col gap-3"></div>
  </div>
</section>

<!-- ================= CONTACT ================= -->
<section id="contact" class="relative overflow-hidden py-24 md:py-28" style="background:linear-gradient(160deg,#0B1424 0%,#0F1E38 55%,#0B1424 100%);">
  <div class="blueprint-grid subtle"></div>
  <div class="max-w-4xl mx-auto px-5 md:px-8 relative text-center">
    <div class="flex items-center justify-center gap-2 mb-3">
      <span class="eyebrow-dash"></span>
      <span class="text-xs font-semibold tracking-widest uppercase font-display" style="color:var(--emerald);" data-i18n="home.contactSection.eyebrow"></span>
      <span class="eyebrow-dash"></span>
    </div>
    <h2 class="text-3xl md:text-5xl font-bold text-white mb-4 font-display" data-i18n="home.contactSection.title"></h2>
    <p class="text-base md:text-lg mb-3" style="color:rgba(255,255,255,0.68);" data-i18n="home.contactSection.subtitle"></p>
    <p class="text-sm mb-10" style="color:var(--emerald);" data-i18n="common.contact.area"></p>

    <div class="text-4xl md:text-5xl font-bold text-white mb-8 font-display">595 70 83 00</div>

    <div class="flex flex-wrap items-center justify-center gap-4">
      <a href="tel:595708300" class="inline-flex items-center gap-2.5 px-7 py-4 rounded-full text-sm font-semibold btn-primary">
        <i data-lucide="phone" class="w-4 h-4"></i><span data-i18n="common.callNow"></span>
      </a>
      <a href="https://wa.me/995595708300" target="_blank" rel="noopener" class="inline-flex items-center gap-2.5 px-7 py-4 rounded-full text-sm font-semibold btn-whatsapp">
        <i data-lucide="message-circle" class="w-4 h-4"></i><span data-i18n="common.whatsapp"></span>
      </a>
    </div>
  </div>
</section>

<div id="app-footer"></div>
<div id="floating-actions"></div>

<script src="assets/js/i18n.js"></script>
<script>window.CURRENT_PAGE = "home";</script>
<script src="assets/js/app.js"></script>
</body>
</html>
